# Render Blueprint: 저장소를 연결하면 이 설정으로 3차 시제품 서버를 만든다.
services:
  - type: web
    name: judgment-recorder-3
    runtime: node
    rootDir: prototype-3/server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DATABASE_PATH
        value: /var/data/p3.sqlite3
    # 기록을 남기려면 유료 인스턴스에 디스크를 붙인다(무료 플랜은 재시작 시 초기화).
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
