<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판단 기록</title>
<style>
:root{--ink:#111;--mut:#5f5f5f;--line:#e3e3e3;--soft:#f4f4f4;--bg:#fafafa;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);word-break:keep-all}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff}
button{font:inherit;color:inherit;cursor:pointer}
p{margin:0;line-height:1.6}.mut{color:var(--mut);font-size:13px}
#root{height:100%;display:flex;flex-direction:column;min-height:560px}

/* 시작 */
.start{max-width:620px;margin:0 auto;padding:28px 20px;display:flex;flex-direction:column;gap:16px;width:100%}
.start h1{font-size:20px;margin:0}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#3a3a3a;font-weight:700}
textarea,input[type=text]{font:inherit;font-size:15px;font-weight:400;color:var(--ink);border:1px solid #c9c9c9;border-radius:6px;padding:10px 12px;resize:vertical;background:#fff;width:100%}
.primary{min-height:44px;border:0;border-radius:6px;background:var(--ink);color:#fff;font-weight:700;font-size:15px;padding:0 16px}
.primary:disabled{opacity:.35;cursor:default}
.sec{min-height:36px;border:1px solid #c9c9c9;border-radius:6px;background:#fff;font-size:13px;padding:0 12px;white-space:nowrap}
.ghost{border:0;background:transparent;font-size:13px;color:#3a3a3a;text-decoration:underline;min-height:32px;padding:0 4px}
.note{font-size:12px;color:var(--mut);border:1px dashed #c9c9c9;border-radius:6px;padding:8px 10px}

/* 상단 */
.top{display:flex;flex-direction:column;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fff;position:relative;z-index:3}
.crit{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.concept{font-size:13px;color:#333;line-height:1.5}.concept .k,.more .k{font-size:11px;font-weight:700;color:var(--mut);margin-right:4px}
.more{display:flex;flex-direction:column;gap:2px;font-size:13px}
label.f .q,p.f .q{display:block;font-weight:400;color:var(--mut);font-size:13px;margin-top:2px}
p.f{font-size:13px;color:#3a3a3a;font-weight:700}
.cblock{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.cr{display:flex;flex-direction:column;gap:8px}label.f.sub{padding-left:14px;border-left:2px solid var(--line);font-weight:400}
.crit .k{font-size:11px;font-weight:700;color:var(--mut)}
.crit b{font-size:14px;flex:1;min-width:180px}
.prop{border:1px dashed #8a8a8a;border-radius:8px;padding:8px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff}
.prop .tag{font-size:11px;font-weight:700;border:1px dashed #555;border-radius:999px;padding:0 7px}
.prop span.t{flex:1;min-width:160px;font-size:13px}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tools .cnt{font-size:12px;color:var(--mut);margin-right:auto}
.tools .hint{font-size:12px;color:var(--mut)}
.zoom{display:flex;align-items:center;border:1px solid #c9c9c9;border-radius:6px;overflow:hidden}
.zoom button{border:0;background:#fff;min-width:32px;min-height:34px;font-size:15px}
.zoom span{font-size:12px;min-width:44px;text-align:center}

/* 캔버스 */
.body{flex:1;display:flex;min-height:0;position:relative}
.vp{flex:1;overflow:auto;background:var(--bg);background-image:radial-gradient(#dcdcdc 1px,transparent 1px);background-size:20px 20px;position:relative}
.vp.drag{outline:3px dashed #111;outline-offset:-8px}
.stage{position:relative;transform-origin:0 0}
svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg.edges path{fill:none;stroke:#9a9a9a;stroke-width:1.5}
svg.edges path.hot{stroke:#111;stroke-width:2}
.node{position:absolute;width:180px;background:#fff;border:1px solid #cfcfcf;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.node:hover{border-color:#777}
.node.sel{border:2px solid #111;padding:7px}
.node.focus::after{content:"이야기 중";position:absolute;top:-10px;right:8px;font-size:10px;font-weight:700;background:#111;color:#fff;border-radius:999px;padding:1px 7px}
.node.droptarget{outline:3px solid #111;outline-offset:3px}
.node img{width:100%;height:120px;object-fit:cover;border-radius:6px;background:#eee;display:block}
.node .nm{font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center}
.node .lt{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:5px;background:#111;color:#fff;font-size:12px}
.lb{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid #111;align-self:flex-start}
.lb.none{border-style:dashed;border-color:#9a9a9a;color:var(--mut);font-weight:400}
.lb.선택{background:#111;color:#fff}
.lb.제외{border-color:#9a9a9a;color:var(--mut)}
.node.x{width:120px;opacity:.6;padding:6px}
.node.idea{background:#fff;border-style:solid;gap:4px}
.node.idea.pending{border:1.5px dashed #777}
.node.idea.summary{background:#f6f6f6}
.node{touch-action:none;cursor:grab}.node.dragging{cursor:grabbing;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:5;opacity:.95}
.node.idea .lt{min-width:auto;padding:0 6px;font-size:11px}
.node.idea .it{font-size:12px;line-height:1.45;color:#333;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.node.x img{height:44px;filter:grayscale(1)}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;pointer-events:none}
.empty div{max-width:360px;text-align:center;display:flex;flex-direction:column;gap:6px;color:var(--mut);font-size:14px;border:2px dashed #c9c9c9;border-radius:12px;padding:28px 20px;background:#fff}
.dropmsg{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#111;color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:6px 14px;pointer-events:none;z-index:4}

/* 옆 패널(넓을 때) / 아래 시트(좁을 때) */
.panel{width:340px;border-left:1px solid var(--line);background:#fff;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:16px;margin:0;display:flex;gap:8px;align-items:center}
.panel .big{width:100%;max-height:260px;object-fit:contain;background:#eee;border-radius:8px}
.labels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.labels button{min-height:42px;border:1px solid #c9c9c9;border-radius:6px;background:#fff;font-size:14px}
.labels button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mut)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:12px;border:1px solid #c9c9c9;border-radius:999px;background:#fff;padding:4px 10px;min-height:32px}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.close{border:0;background:transparent;font-size:20px;margin-left:auto;min-width:32px;min-height:32px}

/* 모달 시트 */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.sheet{background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:17px;margin:0}
.sheet .prev{width:100%;max-height:200px;object-fit:contain;background:#eee;border-radius:8px}
.srcs{display:flex;flex-wrap:wrap;gap:8px}
.src{display:flex;align-items:center;gap:6px;border:1px solid #c9c9c9;border-radius:8px;background:#fff;padding:4px 8px 4px 4px;font-size:13px;min-height:40px}
.src img{width:32px;height:32px;object-fit:cover;border-radius:4px}
.src[aria-pressed=true]{border:2px solid #111;padding:3px 7px 3px 3px;font-weight:700}
.toast{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;border-radius:999px;padding:8px 16px;font-size:13px;z-index:20}
.tl{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
.tl li{position:relative;font-size:13px}.tl li::before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:5px;background:var(--ink)}
.tl .tg{font-size:11px;font-weight:700;border:1px solid #111;border-radius:999px;padding:0 6px;margin-right:6px}

.broken{position:sticky;top:0;z-index:30;background:#111;color:#fff;font-size:13px;line-height:1.55;padding:10px 14px}
@media (max-width:720px){
  .panel{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:70%;border-left:0;border-top:1px solid var(--line);border-radius:12px 12px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.12);z-index:5}
  .tools .hint{display:none}
}
</style>
</head>
<body>
<div id="root"><p class="mut" style="padding:16px">불러오는 중…</p></div>
<input type="file" id="file" accept="image/*" hidden>
<script type="module">
/*VIEW_SCRIPT*/
</script>
</body>
</html>
