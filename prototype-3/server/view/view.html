<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판단 기록</title>
<style>
:root{--ink:#111;--mut:#5f5f5f;--line:#e3e3e3;--soft:#f3f3f3;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);word-break:keep-all}
*{box-sizing:border-box}body{margin:0;background:#fff}
main{padding:16px;display:flex;flex-direction:column;gap:16px;max-width:760px;margin:0 auto}
h1{font-size:18px;margin:0;line-height:1.4}h2{font-size:14px;margin:0;color:var(--mut);font-weight:700}
p{margin:0;line-height:1.6}.mut{color:var(--mut);font-size:13px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:12px}
.crit{background:var(--soft);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.crit b{font-size:15px}
.raw{display:flex;flex-direction:column;gap:8px;max-height:44vh;overflow:auto}
.msg{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}
.msg input{margin-top:3px;width:16px;height:16px;accent-color:#111;flex-shrink:0}
.msg .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.msg .who{font-size:11px;font-weight:700;color:var(--mut)}
.msg .txt{font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.msg.user{background:#fafafa}.msg img{width:96px;height:72px;object-fit:cover;border-radius:4px}
.imgs{display:flex;gap:6px;flex-wrap:wrap}
.labels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.labels button{min-height:44px;border:1px solid #c9c9c9;border-radius:6px;background:#fff;font:inherit;font-size:14px;cursor:pointer}
.labels button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#3a3a3a;font-weight:700}
textarea,select{font:inherit;font-size:15px;font-weight:400;color:var(--ink);border:1px solid #c9c9c9;border-radius:6px;padding:10px 12px;resize:vertical;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:12px;border:1px solid #c9c9c9;border-radius:999px;background:#fff;padding:4px 10px;cursor:pointer;min-height:32px}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.primary{min-height:48px;border:0;border-radius:6px;background:var(--ink);color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghost{border:0;background:transparent;font:inherit;font-size:13px;color:#3a3a3a;text-decoration:underline;cursor:pointer;min-height:36px}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:14px}
.tl li{position:relative}.tl li::before{content:"";position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:6px;background:var(--ink)}
.tag{display:inline-block;font-size:11px;font-weight:700;border:1px solid var(--ink);border-radius:999px;padding:0 7px;margin-right:6px}
.j{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.note{font-size:12px;color:var(--mut);border:1px dashed #c9c9c9;border-radius:6px;padding:8px 10px}
.ok{font-size:14px;font-weight:700}
@media (min-width:640px){main{padding:24px}}
</style>
</head>
<body>
<main id="root"><p class="mut">불러오는 중…</p></main>
<script type="module">
/*VIEW_SCRIPT*/
</script>
</body>
</html>
