# Render Blueprint: 저장소를 연결하면 이 설정으로 3차 시제품 서버를 만든다.
services:
  - type: web
    name: judgment-recorder-3
    runtime: node
    plan: free  # 로그인 확인용. 기록을 남길 때는 유료 플랜 + 아래 disk
    rootDir: prototype-3/server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: Q6_TEXT  # 2차 DBR 원래 Q6 문장. 비우면 판단 뒤 질문 지시를 보내지 않는다
        sync: false
    # 무료 플랜: DB는 서버 폴더의 data.sqlite3에 생기고, 재시작·재배포 때 비워진다(로그인 확인용).
    # 기록을 남기려면 유료 플랜으로 바꾸고 아래 두 블록을 함께 켠다.
    #   envVars에 추가:
    #   - key: DATABASE_PATH
    #     value: /var/data/p3.sqlite3
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
